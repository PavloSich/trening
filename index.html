const save=()=>{if(CF.c&&dat()!==lh){S.ts=Date.now();lh=dat();clearTimeout(tmr);tmr=setTimeout(push,800)}save0()};
const hd=()=>{const h={apikey:CF.k,"Content-Type":"application/json"};if(/^eyJ/.test(CF.k))h.Authorization="Bearer "+CF.k;return h};
const ss=t=>{const e=document.getElementById("sy");if(e)e.textContent=t};
const mg=(a,b)=>{const o={...a};for(const k in b){const m=new Map();[...(o[k]||[]),...b[k]].forEach(x=>m.set(x.t,x));o[k]=[...m.values()].sort((x,y)=>x.t-y.t)}return o};
async function push(){if(!CF.u||!CF.k||!CF.c)return;try{const r=await fetch(CF.u+"/rest/v1/wl",{method:"POST",headers:{...hd(),Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id:CF.c,data:JSON.parse(dat()),updated_at:new Date(S.ts||Date.now()).toISOString()})});ss(r.ok?"Синхронізовано "+new Date().toLocaleTimeString("uk-UA"):"Помилка "+r.status)}catch(e){ss("Немає зв’язку")}}
async function pull(){if(!CF.u||!CF.k||!CF.c)return;try{const r=await fetch(CF.u+"/rest/v1/wl?id=eq."+encodeURIComponent(CF.c)+"&select=data,updated_at",{headers:hd()});if(!r.ok){ss("Помилка "+r.status);return}const a=await r.json();if(a[0]&&Date.parse(a[0].updated_at)>(S.ts||0)){const d=a[0].data,first=!S.ts;S.h=first?mg(S.h,d.h||{}):(d.h||{});S.fn={...(first?S.fn||{}:{}),...(d.fn||{})};S.cel=d.cel||S.cel||0;S.ts=first?Date.now():Date.parse(a[0].updated_at);lh=dat();save0();render();if(first)await push();else ss("Дані завантажено з хмари")}else{lh=dat();if(!a[0])await push();else if((S.ts||0)>Date.parse(a[0].updated_at))await push();else ss("Синхронізовано")}}catch(e){ss("Немає зв’язку")}}
const R=t=>{const[m,s]=t.split(":");return +m*60+ +s},fm=s=>{const m=Math.floor(s/60),r=s%60;return(m?m+" хв":"")+(m&&r?" ":"")+(r?r+" с":"")};
const P=sp=>{const[a,b]=sp.split("|"),f=s=>{if(!s)return null;const[n,r]=s.split("x");return{n:+n,r:r==="B"?"в блоці":r||"—"}};return{w:f(a),s:f(b)}};
const dt=t=>new Date(t).toLocaleDateString("uk-UA",{day:"2-digit",month:"2-digit"});
const fs=a=>(a||[]).map(x=>esc(x[0]||"–")+"×"+esc(x[1]||"–")).join(", ");
const last=k=>{const a=S.h[k]||[];return a[a.length-1]};
const isDn=(d,i)=>!!(S.dn&&S.dn[d]&&S.dn[d][i]);const allDn=w=>w.x.every((_,i)=>isDn(w.id,i));let cur=(W.some(x=>x.id===S.cur)?S.cur:"d1"),tab="w",open=null;
function viewW(w){
 let h=`<select id="sel"${(S.fn&&S.fn[w.id])||allDn(w)?' style="color:var(--ok);font-weight:600"':""}>${W.map(x=>`<option value="${x.id}"${x.id===cur?" selected":""}${(S.fn&&S.fn[x.id])||allDn(x)?' style="color:var(--ok);font-weight:600"':""}>${(S.fn&&S.fn[x.id])||allDn(x)?"✓ ":""}${x.n} · ${x.t[1]}</option>`).join("")}</select><div class="sub" style="margin:6px 2px">кг × повтори</div>`;
 const dr=S.dr[w.id]||{};
 w.x.forEach((it,i)=>{
  const[ek,sp,pdo,ck,rt]=it,p=P(sp),L=last(ek),d=dr[i]||{},sec=R(rt),c=ck?C[ck]:null,dn=isDn(w.id,i);
  const row=(k,n,lab)=>{let r="";for(let j=0;j<n;j++){const lv=(L&&L[k]&&L[k][j])||[],v=(d[k]&&d[k][j])||[];r+=`<div class="set"><span>${lab}${j+1}</span><input inputmode="decimal"${dn?" disabled":""} data-k="${k}" data-j="${j}" data-f="0" placeholder="${esc(lv[0]||"кг")}" value="${esc(v[0]||"")}"><i>×</i><input inputmode="numeric"${dn?" disabled":""} data-k="${k}" data-j="${j}" data-f="1" placeholder="${esc(lv[1]||"повт")}" value="${esc(v[1]||"")}"><button${dn?" disabled":""}${S.td&&S.td[w.id+"-"+i+k+j]?' class="ok"':""} data-sec="${sec}" data-lab="⏱ ${fm(sec)}" data-tid="${w.id}-${i}${k}${j}"${k==="s"&&j===n-1?' data-last="1"':""}>${S.td&&S.td[w.id+"-"+i+k+j]?"✓ Break is over":"⏱ "+fm(sec)}</button></div>`}return r};
  h+=`<div class="card${isDn(w.id,i)?" done":""}" data-i="${i}"><div class="nm">${isDn(w.id,i)?"✓ ":""}${i+1}. ${E[ek][1]}</div>`;
  if(p.w)h+=`<div class="ln"><b>Розминочні:</b> ${p.w.n} × ${p.w.r} · відпочинок між ними ${fm(sec)}</div>`;
  h+=`<div class="ln"><b>Робочі:</b> ${p.s.n} × ${p.s.r} · відпочинок ${fm(sec)} · ПДВ ${pdo}</div>`;
  if(c)h+=`<div class="cm">${c[1]}</div>`;
  h+=`<div class="last">${L?`Минулого разу (${dt(L.t)}): ${L.w.length?"розм. "+fs(L.w)+"; ":""}роб. ${fs(L.s)}<br><button class="s" data-fill="1"${dn?" disabled":""}>⤵ Підставити минуле</button>`:"Ще немає записів для цієї вправи"}</div>`;
  if(dn)h+=`<div class="dnb"><span>✓ Вправу виконано</span></div>`;
  if(p.w)h+=row("w",p.w.n,"Р");
  h+=row("s",p.s.n,"№")+`<button class="s" data-done="${i}">${dn?"✎ Редагувати":"✓ Вправу виконано"}</button></div>`;
 });
 
 const ad=allDn(w);return h+`<button class="p" data-fin="1"${ad?"":" disabled"}${ad?"":' style="background:var(--bd);color:var(--mu)"'}>${ad?"✓ Завершити та зберегти тренування":"Заверши всі вправи, щоб зберегти тренування"}</button>`;
}
function viewP(){
 const ks=Object.keys(S.h).filter(k=>S.h[k].length);let h=(S.cel?'<button class="p" data-cel="1" style="margin:0 0 10px">🎆 Показати привітання</button>':"");
 if(!ks.length)h+=`<div class="card sub">Поки що немає збережених тренувань.</div>`;
 ks.forEach(k=>{
  const a=S.h[k],tops=a.map(x=>Math.max(0,...x.s.map(y=>parseFloat(String(y[0]).replace(",","."))||0)));
  h+=`<div class="card"><div class="nm" data-ex="${k}" style="cursor:pointer">${E[k]?E[k][1]:esc(k)}</div><div class="ru">Макс. вага: ${tops.slice(-8).join(" → ")} кг</div>`;
  if(open===k)h+=a.map((x,j)=>`<div class="ln">${dt(x.t)}: ${x.w.length?"розм. "+fs(x.w)+"; ":""}роб. ${fs(x.s)} <button class="s" data-del="${k}:${j}">✕</button></div>`).reverse().join("");
  h+=`</div>`;
 });
 return h+`<div class="card"><div class="nm">Хмарна синхронізація</div><div class="sub" style="margin:4px 0 8px">Supabase: адреса проєкту, ключ anon і твій секретний код (однаковий на всіх пристроях)</div><input class="cf" id="cu" placeholder="https://xxxx.supabase.co" value="${esc(CF.u||"")}"><input class="cf" id="ck" placeholder="anon public key" value="${esc(CF.k||"")}"><input class="cf" id="cc" placeholder="секретний код, напр. pavlo-7391-xk2" value="${esc(CF.c||"")}"><button class="s" id="csv">Зберегти й синхронізувати</button><div class="sub" id="sy"></div></div><div class="card"><div class="nm">Резервна копія</div><div class="ru">Скопіюй текст для збереження або встав свій і натисни «Імпорт».</div><textarea id="bk">${esc(JSON.stringify(S.h))}</textarea><button class="s" id="imp">Імпорт</button></div>`;
}
function render(){
 const w=W.find(x=>x.id===cur);
 $("#app").innerHTML=`<div class="tabs"><button class="${tab==="w"?"on":""}" data-t="w">Тренування</button><button class="${tab==="p"?"on":""}" data-t="p">Прогрес</button></div>`+(tab==="w"?viewW(w):viewP());
}
let ti,ac,tid=null,tl="";
function beep(){try{const n=ac.currentTime;[0,.35,.7].forEach(o=>{const x=ac.createOscillator(),g=ac.createGain();x.frequency.value=880;g.gain.setValueAtTime(.3,n+o);g.gain.exponentialRampToValueAtTime(.001,n+o+.25);x.connect(g);g.connect(ac.destination);x.start(n+o);x.stop(n+o+.26)})}catch(x){}}
const tb=()=>tid&&document.querySelector('[data-tid="'+tid+'"]');
function tstop(){clearInterval(ti);const b=tb();if(b){b.textContent=tl;b.className=""}tid=null}
function toast(t){const e=$("#tt");e.textContent="✓ "+t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>{e.hidden=true},1600)}
function doneAll(){const q=$("#fq");q.innerHTML=`<div class="bx"><div class="nm">Тренування завершено! 🎉</div><div class="sub" style="margin:6px 0 12px">Усі вправи виконано. Тепер можна зберегти тренування.</div><button class="p" data-sv="1">✓ Зберегти тренування</button><button class="s" data-n="1" style="width:100%;padding:12px;margin:8px 0 0">Пізніше</button></div>`;q.hidden=false}
function nx(i){setTimeout(()=>{const n=W.find(x=>x.id===cur).x.length;let t=-1;for(let j=i+1;j<n;j++)if(!isDn(cur,j)){t=j;break}if(t<0)for(let j=0;j<i;j++)if(!isDn(cur,j)){t=j;break}const e=t>=0?document.querySelector('.card[data-i="'+t+'"]'):document.querySelector("[data-fin]");if(e)e.scrollIntoView({behavior:"smooth",block:"start"})},500)}
let raf;
function fw(){const c=$("#cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;let P=[],n=0;const bang=()=>{const cx=Math.random()*c.width,cy=Math.random()*c.height*.55+40,h=Math.random()*360;for(let i=0;i<60;i++){const a=Math.random()*6.283,s=Math.random()*5+1.5;P.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h})}};const f=()=>{x.fillStyle="rgba(18,35,94,.2)";x.fillRect(0,0,c.width,c.height);if(n++%35===0)bang();P=P.filter(p=>p.l>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.vx*=.985;p.l-=.011;x.fillStyle="hsla("+p.h+",90%,60%,"+p.l+")";x.fillRect(p.x,p.y,3,3)});raf=requestAnimationFrame(f)};cancelAnimationFrame(raf);f()}
function cel(){$("#cl").hidden=false;fw()}
const MAN='<svg viewBox="0 0 60 80" width="48" height="64"><rect x="21" y="60" width="8" height="18" fill="#f0b98d"/><rect x="31" y="60" width="8" height="18" fill="#f0b98d"/><rect x="2" y="22" width="14" height="8" fill="#f0b98d"/><rect x="2" y="8" width="8" height="16" fill="#f0b98d"/><rect x="44" y="22" width="14" height="8" fill="#f0b98d"/><rect x="50" y="8" width="8" height="16" fill="#f0b98d"/><circle cx="9" cy="20" r="6" fill="#e0a074"/><circle cx="51" cy="20" r="6" fill="#e0a074"/><circle cx="6" cy="7" r="5" fill="#f0b98d"/><circle cx="54" cy="7" r="5" fill="#f0b98d"/><path d="M14 22h32l-6 28H20z" fill="#f0b98d"/><rect x="20" y="50" width="20" height="12" fill="#c0392b"/><circle cx="30" cy="13" r="8" fill="#f0b98d"/><path d="M22 11q8-9 16 0v-3q-8-7-16 0z" fill="#3b2a1a"/></svg>';
function pump(){const q=$("#cl"),r=$("#clx").getBoundingClientRect();for(let i=0;i<6;i++){const e=document.createElement("div");e.innerHTML=MAN;e.style.cssText="position:fixed;z-index:30;pointer-events:none;left:"+(r.left+r.width/2-24)+"px;top:"+(r.top-20)+"px";q.appendChild(e);const dx=(Math.random()-.5)*440,dy=-(120+Math.random()*300),rt=(Math.random()-.5)*720,t="translate("+dx+"px,"+dy+"px) rotate("+rt+"deg) scale(1.1)";e.animate([{transform:"translate(0,0) rotate(0deg) scale(.4)",opacity:1},{transform:t,opacity:1,offset:.7},{transform:t,opacity:0}],{duration:1300+Math.random()*700,easing:"ease-out"}).onfinish=()=>e.remove()}}
$("#clx").onclick=pump;
$("#clc").onclick=()=>{$("#cl").hidden=true;cancelAnimationFrame(raf)};
function ask(d,i){const w=W.find(x=>x.id===d),q=$("#fq");q.innerHTML=`<div class="bx"><div class="nm">Фініш вправи?</div><div class="sub" style="margin:6px 0 12px">${E[w.x[i][0]][1]}</div><button class="p" data-y="1">✓ Так, вправу виконано</button><button class="s" data-n="1" style="width:100%;padding:12px;margin:8px 0 0">Ще ні</button></div>`;q.dataset.d=d;q.dataset.i=i;q.hidden=false}
$("#fq").onclick=e=>{const q=$("#fq"),t=e.target.dataset;if(t.y){const m=(S.dn=S.dn||{}),o=(m[q.dataset.d]=m[q.dataset.d]||{});o[q.dataset.i]=true;save();q.hidden=true;render();nx(+q.dataset.i);if(allDn(W.find(x=>x.id===q.dataset.d)))setTimeout(doneAll,600)}else if(t.sv){q.hidden=true;fin()}else if(t.n||e.target===q)q.hidden=true};
function tm(b){const same=tid&&b.dataset.tid===tid;tstop();if(same)return;
 try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(x){}
 const id=b.dataset.tid,last=b.dataset.last,m=id.match(/^(.+)-(\d+)[ws]\d+$/),e=Date.now()+ +b.dataset.sec*1000;tid=id;tl=b.dataset.lab;if(S.td&&S.td[id]){delete S.td[id];save0()}
 const u=()=>{const r=Math.max(0,Math.round((e-Date.now())/1000)),x=tb();if(x)x.className=r?"run":"ok";if(x)x.textContent=r?"⏱ "+Math.floor(r/60)+":"+String(r%60).padStart(2,"0"):"✓ Break is over";if(!r){clearInterval(ti);beep();if(last&&m&&!isDn(m[1],+m[2]))ask(m[1],+m[2]);try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(z){}(S.td=S.td||{})[id]=1;save0();tid=null}};u();ti=setInterval(u,250)}

function fin(){
 const w=W.find(x=>x.id===cur);if(!allDn(w))return;let n=0;
 w.x.forEach((it,i)=>{const o=(S.dr[cur]||{})[i];if(!o)return;const f=a=>(a||[]).filter(x=>x&&(x[0]||x[1])),ww=f(o.w),ss=f(o.s);if(!ww.length&&!ss.length)return;(S.h[it[0]]=S.h[it[0]]||[]).push({t:Date.now(),d:cur,w:ww,s:ss});n++});
 (S.fn=S.fn||{})[cur]=1;if(S.td)for(const k in S.td)if(k.startsWith(cur+"-"))delete S.td[k];delete S.dr[cur];if(S.dn)delete S.dn[cur];const all=W.every(x=>S.fn&&S.fn[x.id])&&!S.cel;if(all)S.cel=1;save();tab="p";render();if(all)setTimeout(cel,300);
}
const app=$("#app");
app.addEventListener("change",e=>{if(e.target.id==="sel"){cur=e.target.value;S.cur=cur;save0();render()}});
app.addEventListener("input",e=>{const t=e.target,d=t.dataset;if(d.k===undefined)return;const i=t.closest(".card").dataset.i,dd=(S.dr[cur]=S.dr[cur]||{}),o=(dd[i]=dd[i]||{w:[],s:[]}),a=o[d.k];while(a.length<=+d.j)a.push(["",""]);a[d.j][d.f]=t.value;save()});
app.addEventListener("click",e=>{const t=e.target,d=t.dataset;
 if(d.t){tab=d.t;render()}
 else if(d.sec)tm(t);
 else if(d.fill){t.closest(".card").querySelectorAll(".set input").forEach(x=>{if(!x.value&&/^[\d.,]+$/.test(x.placeholder)){x.value=x.placeholder;x.dispatchEvent(new Event("input",{bubbles:true}))}})}
 else if(d.done!==undefined){const m=(S.dn=S.dn||{}),o=(m[cur]=m[cur]||{});o[d.done]=!o[d.done];save();render();if(o[d.done]){nx(+d.done);if(allDn(W.find(x=>x.id===cur)))setTimeout(doneAll,600)}}
 else if(d.cel)cel();
 else if(d.fin)fin();
 else if(d.ex){open=open===d.ex?null:d.ex;render()}
 else if(d.del){const[k,j]=d.del.split(":");S.h[k].splice(+j,1);save();render()}
 else if(t.id==="csv"){CF={u:$("#cu").value.trim().replace(/\/$/,""),k:$("#ck").value.trim(),c:$("#cc").value.trim()};try{localStorage.setItem("wlcfg",JSON.stringify(CF))}catch(x){}pull()}
 else if(t.id==="imp"){try{const o=JSON.parse($("#bk").value);if(o&&typeof o==="object"){S.h=o;save();render()}}catch(x){}}
});
render();pull();document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
</script></body></html>
